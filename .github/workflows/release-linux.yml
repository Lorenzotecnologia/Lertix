name: Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Check Django configuration
        run: python manage.py check
        working-directory: backend

      - name: Run tests
        run: python manage.py test
        working-directory: backend

      - name: Build Linux package
        run: |
          mkdir -p dist/lertix-linux
          cp -R backend dist/lertix-linux/backend
          cp linux/launch.sh linux/README.md dist/lertix-linux/
          tar -czf dist/lertix-linux.tar.gz \
            --exclude='__pycache__' \
            --exclude='*.py[cod]' \
            --exclude='*.sqlite3' \
            -C dist lertix-linux

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/lertix-linux.tar.gz --clobber
          else
            gh release create "$tag" dist/lertix-linux.tar.gz \
              --verify-tag \
              --title "$tag" \
              --generate-notes
          fi
