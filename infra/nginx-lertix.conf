server {
    listen 80;
    listen [::]:80;
    server_name lertrix.com www.lertrix.com;

    client_max_body_size 10m;

    location /static/ {
        alias /opt/lertix/app/backend/staticfiles/;
    }

    location /media/ {
        alias /var/lib/lertix/media/;
    }

    location / {
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/lertix/gunicorn.sock;
    }
}
