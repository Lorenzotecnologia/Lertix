services:
  - type: web
    name: lertrix
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --no-input
    preDeployCommand: python backend/manage.py migrate --noinput
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    disk:
      name: lertrix-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: lertrix.com,www.lertrix.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://lertrix.com,https://www.lertrix.com
      - key: CANONICAL_HOST
        value: www.lertrix.com
      - key: EMAIL_HOST
        value: email-ssl.com.br
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: contato@lertrix.com
      - key: CONTACT_EMAIL_TO
        value: contato@lertrix.com
      - key: WHATSAPP_NUMBER
        value: "5511983831766"
      - key: CORREIOS_USERNAME
        sync: false
      - key: CORREIOS_ACCESS_CODE
        sync: false
      - key: CORREIOS_POSTING_CARD
        sync: false
      - key: CORREIOS_PAC_CODE
        sync: false
      - key: CORREIOS_SEDEX_CODE
        sync: false
      - key: CORREIOS_PACKAGE_LENGTH_CM
        sync: false
      - key: CORREIOS_PACKAGE_WIDTH_CM
        sync: false
      - key: CORREIOS_PACKAGE_HEIGHT_CM
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: lertrix-db
          property: connectionString

databases:
  - name: lertrix-db
    databaseName: lertrix
    user: lertrix
    plan: basic-256mb
