# Versão GRATUITA (teste): serviço dorme por inatividade, banco expira em 30 dias
# e capas enviadas pelo admin não persistem. Para produção use render.paid.yaml.
services:
  - type: web
    name: lertrix
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --no-input
    startCommand: python backend/manage.py migrate --noinput && (python backend/manage.py createsuperuser --noinput || true) && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: lertrix.com,www.lertrix.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://lertrix.com,https://www.lertrix.com
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: EMAIL_HOST
        value: email-ssl.com.br
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: contato@lertrix.com
      - key: CONTACT_EMAIL_TO
        value: contato@lertrix.com
      - key: WHATSAPP_NUMBER
        value: "5511983831766"
      - key: DATABASE_URL
        fromDatabase:
          name: lertrix-db
          property: connectionString

databases:
  - name: lertrix-db
    databaseName: lertrix
    user: lertrix
    plan: free
