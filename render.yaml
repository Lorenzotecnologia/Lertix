services:
  - type: web
    name: lertrix
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --no-input
    preDeployCommand: python backend/manage.py migrate --noinput
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    disk:
      name: lertrix-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: lertrix.com,www.lertrix.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://lertrix.com,https://www.lertrix.com
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: lertrix-db
          property: connectionString

databases:
  - name: lertrix-db
    databaseName: lertrix
    user: lertrix
    plan: basic-256mb
